# Render Blueprint for the public "Verify and Retrieve" page (free plan).
# Free web services sleep after 15 minutes idle; the first request after that takes ~1 minute.
# Nothing written to disk survives a restart, which is fine in public mode (cache only).
# No COURTLISTENER_API_TOKEN on purpose: users bring their own token (X-CL-API-Token header).
# If one were set here, the client would fall back to it for anyone who didn't paste a token.
services:
  - type: web
    name: verify-and-retrieve
    runtime: python
    plan: free
    buildCommand: pip install ".[web]"
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MODE
        value: public
      - key: PYTHON_VERSION
        value: "3.11.11"
